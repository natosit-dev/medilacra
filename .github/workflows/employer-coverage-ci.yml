name: Employer Coverage Branch CI

on:
  push:
    branches:
      - experiment/employer-coverage

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run employer coverage pytest suite
        run: |
          pytest -q \
            tests/test_coverage.py \
            tests/test_coverage_contracts.py \
            tests/test_coverage_storage.py \
            tests/test_coverage_pipeline_integration.py \
            tests/test_gt1_employer_mvp.py \
            tests/test_fhir_coverage_conversion.py \
            tests/test_reality_separation.py \
            tests/test_payer_matching.py \
            tests/test_payer_eligibility.py \
            tests/test_x12_270_271.py

      - name: Run full regression suite
        run: pytest -q

      - name: Print deterministic coverage reality demo
        run: python scripts/demo_employer_coverage.py

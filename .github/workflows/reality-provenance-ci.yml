name: Reality Provenance Refactor CI

on:
  push:
    branches:
      - refactor/reality-provenance
  workflow_dispatch:

jobs:
  pytest-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Core persistence and provenance tests
        run: python -m pytest -q tests/test_reality_persistence.py tests/test_storage_duckdb_entities.py tests/test_claims_epa_pipeline.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Claims/ePA CLI smoke
        run: |
          python -m claims_epa --seed 43 --count 2 --at 2026-10-07T23:00:00 --out /tmp/reality-provenance-cli
          test -f /tmp/reality-provenance-cli/CLAIMS_EPA_20261007_230000_00001/835.x12

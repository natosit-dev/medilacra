name: Connectathon smoke tests

on:
  push:
    branches:
      - connectathon/piqi-43
  pull_request:
    branches:
      - main

jobs:
  connectathon-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MediLacra
        uses: actions/checkout@v4

      - name: Checkout PIQITT Connectathon branch
        uses: actions/checkout@v4
        with:
          repository: natosit-dev/piqitt
          ref: connectathon/piqi-43
          path: piqitt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest faker

      - name: Compile Connectathon modules
        run: |
          python -m py_compile \
            connectathon/__init__.py \
            connectathon/fhir_control.py \
            connectathon/piqitt_bridge.py \
            connectathon/preflight.py \
            connectathon/provenance.py \
            connectathon/scenarios.py \
            connectathon/shn_mvp0.py \
            connectathon/run.py \
            experiments/disco_inferno/fhir_corruptions.py \
            hl7_demo/labs.py \
            pages/9_PIQI_Connectathon_43.py \
            pages/10_SHN_MVP0.py

      - name: Run Connectathon tests
        env:
          PIQITT_REPO: ${{ github.workspace }}/piqitt
        run: |
          python -m pytest -q \
            tests/test_connectathon_fhir_corruptions.py \
            tests/test_connectathon_control_quality.py \
            tests/test_connectathon_scenarios.py \
            tests/test_connectathon_piqitt_integration.py \
            tests/test_shn_mvp0.py

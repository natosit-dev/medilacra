name: Connectathon smoke tests

on:
  push:
    branches:
      - connectathon/piqi-43
      - experiment/shn-mvp0
  pull_request:
    branches:
      - main

jobs:
  connectathon-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MediLacra
        uses: actions/checkout@v4

      - name: Checkout PIQITT Connectathon branch
        uses: actions/checkout@v4
        with:
          repository: natosit-dev/piqitt
          ref: connectathon/piqi-43
          path: piqitt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest faker

      - name: Compile Connectathon modules
        run: |
          python -m py_compile \
            connectathon/__init__.py \
            connectathon/fhir_control.py \
            connectathon/piqitt_bridge.py \
            connectathon/preflight.py \
            connectathon/provenance.py \
            connectathon/scenarios.py \
            connectathon/shn_mvp0.py \
            connectathon/shn_medilacra_crd.py \
            connectathon/shn_lumbar_fusion.py \
            connectathon/shn_lumbar_fusion_dtr.py \
            connectathon/shn_bulk_crd.py \
            connectathon/shn_rule_matrix.py \
            connectathon/shn_bulk_dtr.py \
            connectathon/shn_dtr_questionnaire_response.py \
            connectathon/shn_lumbar_fusion_pas.py \
            connectathon/shn_bulk_pas.py \
            connectathon/run.py \
            experiments/disco_inferno/fhir_corruptions.py \
            hl7_demo/labs.py \
            pages/9_PIQI_Connectathon_43.py \
            connectathon/shn_provider/__init__.py \
            connectathon/shn_provider/scenario.py \
            connectathon/shn_provider/scenario_registry.py \
            connectathon/shn_provider/client.py \
            connectathon/shn_provider/summaries.py \
            connectathon/shn_provider/state.py \
            connectathon/shn_provider/artifacts.py \
            connectathon/shn_provider/crd.py \
            connectathon/shn_provider/dtr.py \
            connectathon/shn_provider/pas.py \
            connectathon/shn_provider/workflow.py \
            connectathon/shn_provider/run.py \
            pages/10_SHN_Provider_ePA.py

      - name: Check SHN batch runner syntax
        run: |
          bash -n connectathon/shn_bulk_crd_send.sh
          bash -n connectathon/shn_rule_matrix_send.sh
          bash -n connectathon/shn_bulk_dtr_send.sh
          bash -n connectathon/shn_lumbar_fusion_pas_send.sh
          bash -n connectathon/shn_bulk_pas_send.sh

      - name: Run Connectathon tests
        env:
          PIQITT_REPO: ${{ github.workspace }}/piqitt
        run: |
          python -m pytest -q \
            tests/test_connectathon_fhir_corruptions.py \
            tests/test_connectathon_control_quality.py \
            tests/test_connectathon_scenarios.py \
            tests/test_connectathon_piqitt_integration.py \
            tests/test_shn_mvp0.py \
            tests/test_shn_medilacra_crd.py \
            tests/test_shn_lumbar_fusion.py \
            tests/test_shn_lumbar_fusion_dtr.py \
            tests/test_shn_bulk_crd.py \
            tests/test_shn_rule_matrix.py \
            tests/test_shn_bulk_dtr.py \
            tests/test_shn_dtr_questionnaire_response.py \
            tests/test_shn_lumbar_fusion_pas.py \
            tests/test_shn_bulk_pas.py \
            tests/test_shn_provider_workflow.py

name: Gravity SDOH baseline smoke tests

on:
  push:
    branches:
      - feature/gravity-sdoh-baseline-v0.1
  pull_request:
    branches:
      - main

jobs:
  gravity-sdoh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MediLacra
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest duckdb streamlit faker pandas pyyaml

      - name: Compile SDOH and caregiver modules
        run: |
          python -m py_compile \
            connectathon/gravity_sdoh_terminology.py \
            connectathon/gravity_sdoh_questionnaire.py \
            connectathon/gravity_sdoh_response.py \
            connectathon/gravity_sdoh_materialize.py \
            connectathon/gravity_sdoh_quality.py \
            connectathon/gravity_sdoh_hl7v2.py \
            connectathon/gravity_sdoh.py \
            pages/11_Gravity_SDOH.py \
            tests/test_gravity_sdoh.py \
            tests/test_gravity_sdoh_hl7v2.py \
            tests/test_gravity_sdoh_streamlit.py

      - name: Run SDOH tests and caregiver regression
        run: |
          python -m pytest -q \
            tests/test_gravity_sdoh.py \
            tests/test_gravity_sdoh_hl7v2.py \
            tests/test_gravity_sdoh_streamlit.py \
            tests/test_gravity_caregiver.py \
            tests/test_gravity_hl7v2.py \
            tests/test_gravity_caregiver_streamlit.py

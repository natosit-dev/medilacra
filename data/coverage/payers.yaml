version: 0.1
scope: payer_brand_fixtures
documentation_note: >
  The payer records are brand-level MVP fixtures. Actual legal underwriting
  entities and products vary by state, employer, funding arrangement, and
  product. actual_plan_references are documentation for later expansion only
  and MUST NOT be consumed by MVP assignment logic.

